{% load static %}<!doctype html>
<html lang="{{ lang }}" dir="{{ dir }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page_title }}</title>
    <meta name="description" content="{{ page_description }}" />
    <link rel="canonical" href="{{ canonical }}" />
    {% for alt in alternates %}
    <link rel="alternate" hreflang="{{ alt.lang }}" href="{{ alt.url }}" />
    {% endfor %}
    {% block extra_head %}{% endblock %}

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Focus Learn" />
    <meta property="og:title" content="{{ page_title }}" />
    <meta property="og:description" content="{{ page_description }}" />
    <meta property="og:url" content="{{ canonical }}" />
    {% if og_image %}<meta property="og:image" content="{{ og_image }}" />{% endif %}
    <meta name="twitter:card" content="summary_large_image" />

    {% if jsonld %}
    <script type="application/ld+json">{{ jsonld|safe }}</script>
    {% endif %}

    <!-- KaTeX for math rendering (crawlers still read the raw $...$ text) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
      integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+"
      crossorigin="anonymous"
    />
    <style>
      :root { --bg:#f6f7fb; --surface:#fff; --text:#1f2333; --muted:#6b7186;
        --border:#e3e6ef; --primary:#4353ff; --primary-soft:#eceeff; }
      * { box-sizing:border-box; }
      body { margin:0; font-family:'Segoe UI',Tahoma,'Noto Sans Arabic',system-ui,sans-serif;
        background:var(--bg); color:var(--text); line-height:1.7; }
      a { color:var(--primary); text-decoration:none; }
      header.site { background:var(--surface); border-bottom:1px solid var(--border);
        padding:.8rem 1.2rem; position:sticky; top:0; }
      header.site .brand { font-weight:800; color:var(--text); font-size:1.1rem; }
      main { width:min(820px,100%); margin-inline:auto; padding:1.5rem 1.2rem 3rem; }
      h1 { line-height:1.3; }
      .badges { display:flex; gap:.5rem; flex-wrap:wrap; margin:.4rem 0 1rem; }
      .badge { font-size:.8rem; font-weight:600; padding:.15rem .6rem; border-radius:999px;
        background:var(--primary-soft); color:var(--primary); }
      .content > * { margin:.7rem 0; }
      .content h2 { margin-top:1.6rem; }
      .latex-block { background:var(--surface); border:1px solid var(--border);
        border-radius:10px; padding:.8rem; overflow-x:auto; text-align:center; }
      figure { margin:1rem 0; text-align:center; }
      figure img { max-width:100%; border-radius:10px; }
      figcaption { color:var(--muted); font-size:.85rem; }
      .video-thumb { display:block; position:relative; border-radius:10px; overflow:hidden; }
      .video-thumb img { width:100%; display:block; }
      .cta { display:inline-block; background:var(--primary); color:#fff; font-weight:700;
        padding:.6rem 1.3rem; border-radius:10px; margin:1rem 0; }
      .card { display:block; background:var(--surface); border:1px solid var(--border);
        border-radius:12px; padding:1rem; margin:.6rem 0; color:var(--text); }
      .card:hover { border-color:var(--primary); }
      .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:.8rem; }
      .muted { color:var(--muted); }
      ul.plain { list-style:none; padding:0; }
      footer.site { border-top:1px solid var(--border); padding:1.5rem 1.2rem;
        color:var(--muted); font-size:.9rem; text-align:center; }
      .qcard { background:var(--surface); border:1px solid var(--border);
        border-radius:12px; padding:1rem; margin:.6rem 0; }
      .qcard ul { margin:.4rem 0 0; }
    </style>
  </head>
  <body>
    <header class="site">
      <a class="brand" href="{{ app_link }}">Focus Learn</a>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer class="site">
      <p>Focus Learn — منصة تعليمية تفاعلية للتلاميذ.</p>
    </footer>

    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
      integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg"
      crossorigin="anonymous"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
      integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk"
      crossorigin="anonymous"
      onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});"
    ></script>
  </body>
</html>
