name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [claude/new-session-levcek, main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.4
          cache: true

      - name: Build release APK
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: focus-learn-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK to the "apk" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Focus Learn — Android APK
          body: >
            Latest Focus Learn student app APK, built automatically from the
            mobile/ directory. Install on Android (allow "unknown sources"),
            then set the server URL on the login screen.
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
